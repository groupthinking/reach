version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: reach
      POSTGRES_USER: reach_user
      POSTGRES_PASSWORD: reach_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reach_user -d reach"]
      interval: 5s
      timeout: 5s
      retries: 10

  relay:
    build: ./relay
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://reach_user:reach_pass@postgres:5432/reach
      RUST_LOG: info
    ports:
      - "8080:8080"

  audio:
    build: ./audio
    environment:
      MODEL_BACKEND: af3
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build: ./api
    depends_on:
      - relay
      - audio
    ports:
      - "3000:3000"
    env_file: .env

  widget:
    build: ./widget
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  pgdata:
