[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "reach-audio"
version = "0.1.0"
description = "NVIDIA Audio Flamingo inference service for Reach"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "torch==2.14.0",
    "transformers==5.10.1",
    "huggingface_hub==0.23.0",
    "python-dotenv==1.2.3",
    "pydantic==2.7.1",
    "httpx==0.27.0",
    "soundfile==0.12.1",
    "librosa==0.10.2",
    "numpy==1.26.4",
]
